name: plan
 
# aspokes is our main branch (no merge rights on main).
# Plan on PRs into aspokes and on direct pushes to it; these are the only
# two token subjects the plan role's trust policy accepts.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"
 
permissions:
  id-token: write        # required to request the OIDC token
  contents: read
  pull-requests: write   # so it can comment the plan on the PR
 
jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
 
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: show what AWS sees in the OIDC token. Remove once working.
      - name: Debug OIDC claims
        run: |
          echo "role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref, event_name}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
 
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
 
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform validate
 
      # -lock=false because the plan role is read-only and cannot
      # write a lock row. Safe here: a plan changes nothing.
      - run: |
          terraform plan -no-color -lock=false \
            -var-file=ci.tfvars \
            -var="image_tag=${{ github.sha }}"
